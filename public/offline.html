<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e5138" />
    <title>ValeSafra — Offline</title>
    <style>
      :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2933; background: #f5f8f6; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 520px); background: #fff; border: 1px solid #dfe8e2; border-radius: 24px; padding: 32px; box-shadow: 0 24px 60px rgba(31,41,51,.10); }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: #0e5138; font-weight: 800; font-size: 1.35rem; }
      .dot { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: #e9f6ee; }
      h1 { margin: 28px 0 10px; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.05; }
      p { color: #5f6b64; line-height: 1.7; margin: 0; }
      button { margin-top: 24px; min-height: 48px; border: 0; border-radius: 14px; background: #009b4d; color: #fff; padding: 0 18px; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid rgba(0,155,77,.25); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="dot">🌱</span> ValeSafra</div>
      <h1>Você está sem conexão.</h1>
      <p>Algumas telas já visitadas podem continuar disponíveis. Reconecte-se para sincronizar dados, autenticar e executar operações que dependem da API.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
